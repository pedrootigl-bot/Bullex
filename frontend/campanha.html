<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes da Campanha</title>


    <link rel="stylesheet" href="assets/css/style.css">

</head>


<body>


<section class="campaign-detail">

    <div class="container">


        <div class="campaign-detail-card">


            <img 
                id="detail-image"
                src=""
                alt="Imagem da campanha"
            >



            <div class="detail-content">


                <span id="detail-category">
                </span>



                <h1 id="detail-title">
                </h1>



                <p id="detail-description">
                </p>



                <div class="detail-info">


                    <p>
                        Cupom:
                        <strong id="detail-coupon"></strong>
                    </p>



                    <p>
                        Início:
                        <span id="detail-start"></span>
                    </p>



                    <p>
                        Encerramento:
                        <span id="detail-end"></span>
                    </p>



                </div>



            </div>


        </div>


    </div>


</section>




<script src="js/campanha-detalhe.js"></script>


</body>

</html>
