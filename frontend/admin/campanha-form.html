<!DOCTYPE html>

<html lang="pt-BR">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nova Campanha - Bullex Admin</title>

<link
    rel="stylesheet"
    href="../css/admin/dashboard.css"
>
```

</head>

<body>

```
<main>

    <h1>
        Nova Campanha
    </h1>


    <button
        type="button"
        id="voltarBtn"
    >
        Campanhas
    </button>


    <form id="campanha-form">

        <!-- ==========================================
             TÍTULO
        =========================================== -->

        <div>

            <label for="titulo">
                Título
            </label>

            <input
                type="text"
                id="titulo"
                name="titulo"
                required
            >

        </div>


        <!-- ==========================================
             DESCRIÇÃO
        =========================================== -->

        <div>

            <label for="descricao">
                Descrição
            </label>

            <textarea
                id="descricao"
                name="descricao"
                rows="4"
            ></textarea>

        </div>


        <!-- ==========================================
             CATEGORIA
        =========================================== -->

        <div>

            <label for="categoria">
                Categoria
            </label>

            <input
                type="text"
                id="categoria"
                name="categoria"
            >

        </div>


        <!-- ==========================================
             OBJETIVO
        =========================================== -->

        <div>

            <label for="objetivo">
                Objetivo
            </label>

            <input
                type="text"
                id="objetivo"
                name="objetivo"
            >

        </div>


        <!-- ==========================================
             PRÊMIO
        =========================================== -->

        <div>

            <label for="premio">
                Prêmio
            </label>

            <input
                type="text"
                id="premio"
                name="premio"
            >

        </div>


        <!-- ==========================================
             CUPOM
        =========================================== -->

        <div>

            <label for="cupom">
                Cupom
            </label>

            <input
                type="text"
                id="cupom"
                name="cupom"
            >

        </div>


        <!-- ==========================================
             DEPÓSITO MÍNIMO
        =========================================== -->

        <div>

            <label for="deposito_minimo">
                Depósito mínimo
            </label>

            <input
                type="number"
                id="deposito_minimo"
                name="deposito_minimo"
                placeholder="R$ 150"
                min="0"
                step="0.01"
            >

        </div>


        <!-- ==========================================
             DATA DE INÍCIO
        =========================================== -->

        <div>

            <label for="data_inicio">
                Data de início
            </label>

            <input
                type="date"
                id="data_inicio"
                name="data_inicio"
                required
            >

        </div>


        <!-- ==========================================
             DATA DE FIM
        =========================================== -->

        <div>

            <label for="data_fim">
                Data de fim
            </label>

            <input
                type="date"
                id="data_fim"
                name="data_fim"
                required
            >

        </div>


        <!-- ==========================================
             STATUS
        =========================================== -->

        <div>

            <label for="status">
                Status
            </label>

            <select
                id="status"
                name="status"
            >

                <option value="ativa">
                    Ativa
                </option>

                <option value="inativa">
                    Inativa
                </option>

                <option value="encerrada">
                    Encerrada
                </option>

            </select>

        </div>


        <!-- ==========================================
             IMAGEM
        =========================================== -->

        <div>

            <label for="imagem_card">
                URL da imagem
            </label>

            <input
                type="text"
                id="imagem_card"
                name="imagem_card"
                placeholder="https://..."
            >

        </div>


        <!-- ==========================================
             AÇÕES
        =========================================== -->

        <div>

            <button
                type="submit"
            >
                Criar campanha
            </button>

        </div>

    </form>

</main>


<script src="campanha-form.js"></script>
```

</body>

</html>
