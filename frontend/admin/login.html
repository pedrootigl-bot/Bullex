<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Bullex - Login</title>

    <link rel="stylesheet" href="../css/admin/login.css">
</head>

<body>

    <main class="login">

        <div class="login-box">

            <h1>Bullex Admin</h1>

            <p>
                Acesse o painel administrativo
            </p>


            <form id="loginForm">

                <input 
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >


                <input 
                    type="password"
                    id="password"
                    placeholder="Senha"
                    required
                >


                <button type="submit">
                    Entrar
                </button>


                <span id="loginMessage"></span>

            </form>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="login.js"></script>

</body>

</html>
